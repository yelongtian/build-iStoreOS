name: 💿 StX_Build-iStoreOS-src
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、选择设备型号"
        required: true
        default: "emb3531"
        type: choice
        options:
          - emb3531  # 仅保留你的设备
      openwrt_kernel:
        description: "2、选择内核版本"
        required: true
        default: "6.12.y"
        type: choice
        options:
          - 6.12.y  # 唯一无404稳定内核
      auto_kernel:
        description: "自动使用最新内核"
        required: false
        default: true
        type: boolean

env:
  VERSION: 24.10.5

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz

      - name: 🔍 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ ! -f "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      # ===================== 【修正】自定义文件放入工具专属目录 =====================
      - name: 部署自定义U-Boot+DTB
        run: |
          TOOL_DIR="/home/runner/work/_actions/Kwonelee/amlogic-s9xxx-openwrt/main"
          CUSTOM_DIR="${GITHUB_WORKSPACE}/make-openwrt"
          
          # 【核心】工具只识别 files 目录，放这里必生效
          mkdir -p ${TOOL_DIR}/files
          cp -rf ${CUSTOM_DIR}/* ${TOOL_DIR}/files/
          
          echo "✅ 自定义文件部署完成"

      - name: 🧱 打包iStoreOS固件
        uses: Kwonelee/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 📜 重命名固件
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            NEW_NAME=$(echo $FILE | sed "s/openwrt/istoreos_${{ env.VERSION }}/g")
            mv $FILE $NEW_NAME
            echo "重命名完成"
          done

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-SNAPSHOT-dhcp
          body: |
            🔄 版本： iStoreOS-${{ env.VERSION }}-SNAPSHOT
            📦 设备： emb3531
            🧠 内核： 6.12.y
            🔒 密码： 无
            🌐 IP：192.168.100.1
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

